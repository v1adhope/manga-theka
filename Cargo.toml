[package]
name = "manga-theka"
version = "0.1.0"
authors = ["Vladislav Gardner <vladislavgardner@proton.me>"]
edition = "2024"
description = "API backend for manga theka"
documentation = "TODO"
readme = "README.md"
homepage = "TODO"
repository = "https://github.com/v1adhope/manga-theka"
# license = "MIT"
# license-file = "LICENSE"

[lib]
path = "src/lib.rs"

[[bin]]
name = "manga-theka"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
] }
tracing-log = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
