[package]
name = "manga-theka"
version = "0.1.0"
authors = ["Vladislav Gardner <vladislavgardner@proton.me>"]
edition = "2024"
description = "API backend for manga theka"
documentation = "TODO"
readme = "README.md"
homepage = "TODO"
repository = "https://github.com/v1adhope/manga-theka"
license-file = "LICENSE"

[lib]
path = "src/lib.rs"

[[bin]]
name = "manga-theka"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
] }
tracing-log = "0.2"
uuid = { version = "1", features = ["v7", "serde"] }
time = "0.3"
sqlx = { version = "0.9", features = [
  "runtime-tokio",
  "postgres",
  "macros",
  "migrate",
  "uuid",
  "time",
] }
thiserror = "2"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# anyhow = "1"
secrecy = { version = "0.10", features = ["serde"] }
envious = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
