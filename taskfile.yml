version: "3"

dotenv: [".env"]

tasks:
  run:
    desc: Run the application in debug mode
    cmds:
      - cargo run

  build:
    desc: Compile the project in debug mode
    cmds:
      - cargo build

  test:
    desc: Run all tests
    cmds:
      - cargo test

  test-watch:
    desc: Background test watching
    cmds:
      - bacon test

  fmt:
    desc: Check code formatting
    cmds:
      - cargo fmt -- --check

  lint:
    desc: Run clippy and deny all warnings
    cmds:
      - cargo clippy -- -D warnings

  audit:
    desc: Scan dependencies for known security vulnerabilities
    cmds:
      - cargo audit

  code-cov:
    desc: Measure test coverage with tarpaulin (ignoring tests)
    cmds:
      - cargo tarpaulin --ignore-tests

  push-prepare:
    desc: Run all git pre-push checks (fmt, lint, audit, test, build, coverage)
    cmds:
      - task: sqlx-prepare
      - task: fmt
      - task: lint
      - task: audit
      - task: test
      - task: build
      - task: code-cov

  up:
    desc: Build and start docker compose services in detached mode
    cmds:
      - docker compose up -d --build

  down:
    desc: Stop and remove docker compose services
    cmds:
      - docker compose down

  restart:
    desc: Restart docker compose services
    cmds:
      - task: down
      - task: up

  clean:
    desc: "[DANGEROUS] Stop services and delete the postgres data volume (irreversible)"
    cmds:
      - task: down
      - cmd: docker volume rm manga-theka_pgdata
        ignore_error: true

  migration-add:
    desc: Create a new reversible sqlx migration
    cmds:
      - sqlx migrate add -r {{.name}}
    requires:
      vars: [name]

  migration-up:
    desc: Apply all pending database migrations
    cmds:
      - sqlx migrate run

  migration-down:
    desc: Revert the most recent database migration
    cmds:
      - sqlx migrate revert

  sqlx-prepare:
    desc: Generate sqlx offline query data for cargo build
    cmds:
      - cargo sqlx prepare
